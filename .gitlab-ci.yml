stages:
  - test

job1:
  stage: test
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay2
  before_script:
    - apk add --no-cache curl bash
    - curl -Lo minikube https://storage.googleapis.com/minikube/releases/v1.24.0/minikube-linux-amd64
    - chmod +x minikube
    - mv minikube /usr/local/bin/
  script:
    - minikube start --driver=docker --kubernetes-version=v1.22.3
    - kubectl get pods -A
