name: Deploy to Minikube using GitHub Actions

on: [push]
  
jobs:
  job1:
    runs-on: ubuntu-latest
    name: build Node.js Docker Image and deploy to minikube
    steps:
    - uses: actions/checkout@v2
    - name: Start minikube
      uses: medyagh/setup-minikube@master
    - name: Try the cluster !
      run: kubectl get pods -A
    - name: Build image
      run: |
          export SHELL=/bin/bash
          eval $(minikube -p minikube docker-env)
          docker build -f ./Dockerfile -t devopshint/node-app:latest .
          echo -n "verifying images:"
          docker images         
    - name: Deploy to minikube
      run:
        kubectl apply -f k8s-node-app.yaml
    - name: Wait for deployment to complete
      run: kubectl rollout status deployment/nodejs-app
    - name: Wait a few seconds
      run: sleep 10
    - name: Debug pods
      run: |
          echo "=== POD STATUS ==="
          kubectl get pods
          echo "=== POD DETAILS ==="
          kubectl describe pod -l app=nodejs-app
          echo "=== POD LOGS ==="
          kubectl logs -l app=nodejs-app || echo "::warning::No logs yet. Pod may not be running."
          echo "::warning::If Pod is not running, ensure 'imagePullPolicy: Never' in k8s-node-app.yaml."
    - name: Test service URLs
      run: |
          minikube service list
          minikube service nodejs-app --url
